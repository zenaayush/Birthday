<title>Birthday Cake</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Caveat+Brush&display=swap">
<style>
  /* Layout: chunky sticker headline written letter by letter, then the hand-drawn cake, caption and two buttons */
  :root {
    --bg: #4466ff;
    --ink: #14110f;
    --frosting: #dc2f55;
    --frosting-deep: #c01f48;
    --frosting-shine: #ff93ab;
    --sponge: #fbc9a6;
    --cream: #fff4e6;
    --flame-outer: #ff5f6d;
    --flame-mid: #ffc766;
    --flame-core: #fff6d8;
    --font-hand: "Caveat Brush", "Segoe Print", "Comic Sans MS", cursive;
    --font-display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    color-scheme: dark;
    --vh: 1vh;
  }

  @supports (height: 1dvh) {
    :root { --vh: 1dvh; }
  }

  html { height: 100%; }

  body {
    box-sizing: border-box;
    min-height: 100%;
    background: var(--bg);
    color: var(--cream);
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    font-family: var(--font-hand);
    overflow-x: hidden;
  }

  /* Headline */
  .head {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    max-width: 100%;
  }

  .title {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: var(--font-display);
    font-weight: 400;
    line-height: 1;
    text-align: center;
    max-width: 100%;
  }

  .word {
    display: flex;
    justify-content: center;
    white-space: nowrap;
  }

  .word-1 {
    font-size: min(11vw, 4rem, calc(8 * var(--vh)));
    margin-bottom: -0.1em;
  }

  .word-2 {
    font-size: min(15vw, 5.6rem, calc(11 * var(--vh)));
  }

  .ch {
    display: inline-block;
    color: var(--c, var(--cream));
    -webkit-text-stroke: 0.11em var(--ink);
    paint-order: stroke fill;
    text-shadow: 0.04em 0.07em 0 var(--ink);
    margin-inline: 0.012em;
    transform: rotate(var(--r, 0deg));
  }

  /* Letters stay hidden until the button is clicked */
  .head.idle .ch { opacity: 0; }

  /* Cake */
  .stage {
    width: min(92vw, 520px, calc(46 * var(--vh)));
    max-width: 100%;
  }

  svg.cake {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
    -webkit-tap-highlight-color: transparent;
  }

  #hit { cursor: pointer; }

  /* Flame */
  .f {
    transform-box: fill-box;
    transform-origin: 50% 100%;
  }

  #flameWrap {
    transform-origin: 200px 98px;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease-out;
  }

  .glow-wrap { transition: opacity 0.5s ease-out; }
  .glow { transform-origin: 200px 70px; }

  .out #flameWrap {
    transform: scale(0.15, 0.04);
    opacity: 0;
    transition: transform 0.22s ease-in, opacity 0.22s ease-in;
  }
  .out .glow-wrap { opacity: 0; transition: opacity 0.25s ease-in; }

  .wisp {
    fill: none;
    stroke: rgba(255, 255, 255, 0.8);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    opacity: 0;
  }

  #wickEmber { opacity: 0; }

  /* Motion. The headline takes about 10 seconds: 13 letters, one every 0.74s, then the underline. */
  @media (prefers-reduced-motion: no-preference) {
    .f-outer { animation: flick-a 1.3s ease-in-out infinite; }
    .f-mid { animation: flick-b 0.9s ease-in-out infinite; }
    .f-core { animation: flick-c 0.7s ease-in-out infinite; }
    .glow { animation: pulse 2.1s ease-in-out infinite; }

    .play .ch {
      animation: letter-in 0.7s cubic-bezier(0.2, 0.8, 0.3, 1) both;
      animation-delay: calc(var(--i) * 0.74s + 0.3s);
    }
  }

  @keyframes letter-in {
    0% {
      opacity: 0;
      transform: translateY(-0.5em) scale(1.7) rotate(calc(var(--r) - 14deg));
    }
    55% {
      opacity: 1;
      transform: translateY(0.06em) scale(0.92) rotate(calc(var(--r) + 3deg));
    }
    80% {
      opacity: 1;
      transform: translateY(-0.02em) scale(1.04) rotate(var(--r));
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1) rotate(var(--r));
    }
  }

  @keyframes flick-a {
    0%, 100% { transform: scale(1, 1) rotate(0deg); }
    20% { transform: scale(0.95, 1.07) rotate(-3deg); }
    45% { transform: scale(1.05, 0.95) rotate(2.5deg); }
    70% { transform: scale(0.97, 1.05) rotate(-1.5deg); }
  }
  @keyframes flick-b {
    0%, 100% { transform: scale(1, 1) rotate(1deg); }
    30% { transform: scale(0.92, 1.1) rotate(-3deg); }
    60% { transform: scale(1.06, 0.94) rotate(3deg); }
  }
  @keyframes flick-c {
    0%, 100% { transform: scale(1, 1); }
    35% { transform: scale(0.9, 1.12); }
    70% { transform: scale(1.08, 0.92); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }

  /* Hearts: a fixed layer above everything, never blocks taps */
  #hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 20;
  }
  #hearts .heart { position: absolute; display: block; }
  #hearts .heart svg { display: block; width: 100%; height: 100%; }

  /* Button */
  button {
    font: inherit;
    font-size: 1.05rem;
    letter-spacing: 0.02em;
    color: var(--ink);
    background: var(--sponge);
    border: 2.5px solid var(--ink);
    border-radius: 999px;
    padding: 4px 18px 6px;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    touch-action: manipulation;
  }
  button:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  button:focus-visible { outline: 3px solid var(--cream); outline-offset: 4px; }
</style>

<header class="head idle" id="head">
  <h1 class="title" aria-label="Happy Birthday">
    <span class="word word-1">HAPPY</span>
    <span class="word word-2">BIRTHDAY</span>
  </h1>
</header>

<main class="stage">
  <svg id="cake" class="cake out" viewBox="0 -10 400 370" role="img" aria-label="Ek cake jisme ek bujhi hui candle hai">
    <defs>
      <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="4" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <pattern id="stripes" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="rotate(40)">
        <rect width="14" height="14" fill="#ffe3d6"/>
        <rect width="7" height="14" fill="#dc2f55"/>
      </pattern>
      <radialGradient id="glowGrad">
        <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.85"/>
        <stop offset="0.45" stop-color="#ffc46b" stop-opacity="0.28"/>
        <stop offset="1" stop-color="#ffc46b" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- glow behind the flame -->
    <g class="glow-wrap">
      <circle class="glow" cx="200" cy="70" r="125" fill="url(#glowGrad)"/>
    </g>

    <g id="cakeBody" filter="url(#wobble)" stroke="#14110f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <!-- plate -->
      <ellipse cx="200" cy="322" rx="152" ry="24" fill="#c01f48"/>

      <!-- sponge -->
      <path d="M62 226 L62 306 C62 328 130 336 200 336 C270 336 338 328 338 306 L338 226 Z" fill="#fbc9a6"/>

      <!-- frosting with drips -->
      <path fill="#dc2f55" d="M60 214 C60 182 122 168 200 168 C278 168 340 182 340 214 L340 234
        C334 250 318 250 312 236 C306 224 296 228 290 244 C284 262 266 264 258 246
        C252 232 240 232 234 248 C228 266 208 268 200 250 C194 234 182 234 176 250
        C170 268 150 266 144 248 C138 232 128 230 122 246 C116 264 98 262 92 244
        C86 228 76 230 70 240 C66 246 62 244 60 234 Z"/>

      <!-- frosting shine -->
      <g fill="none" stroke="#ff93ab" stroke-width="4">
        <path d="M96 196 Q120 182 160 178"/>
        <path d="M244 178 Q284 180 306 194"/>
      </g>

      <!-- candle -->
      <path d="M188 110 Q188 104 194 104 L206 104 Q212 104 212 110 L212 174 Q200 181 188 174 Z" fill="url(#stripes)" stroke-width="4"/>
      <path d="M200 104 L200 92" fill="none" stroke-width="3.5"/>
    </g>

    <!-- smoke after blowing out -->
    <g>
      <path class="wisp" pathLength="100" d="M200 90 C192 70 210 56 200 36 C192 20 206 8 200 -6"/>
      <path class="wisp" pathLength="100" d="M198 90 C206 74 190 60 198 44 C206 30 192 18 198 6"/>
      <path class="wisp" pathLength="100" d="M202 90 C196 72 212 62 204 46 C198 32 210 20 204 8"/>
      <circle id="wickEmber" cx="200" cy="91" r="3" fill="#ff8a3d"/>
    </g>

    <!-- flame -->
    <g id="flameWrap">
      <g transform="translate(200 94)">
        <path class="f f-outer" fill="#ff5f6d" stroke="#14110f" stroke-width="4" stroke-linejoin="round"
          d="M0 2 C-16 -2 -19 -26 -3 -58 C-2 -62 0 -66 2 -68 C4 -62 19 -30 16 -12 C14 -2 6 2 0 2 Z"/>
        <path class="f f-mid" fill="#ffc766"
          d="M0 -1 C-9 -4 -10 -17 0 -35 C10 -17 9 -4 0 -1 Z"/>
        <path class="f f-core" fill="#fff6d8"
          d="M0 -2 C-4 -4 -4 -10 0 -18 C4 -10 4 -4 0 -2 Z"/>
      </g>
    </g>

    <!-- embers rise from the flame -->
    <g id="embers"></g>

    <!-- tap area over the candle -->
    <rect id="hit" x="160" y="20" width="80" height="160" fill="transparent"/>
  </svg>
</main>

<button id="toggle" type="button">Click me</button>
<div id="hearts" aria-hidden="true"></div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('cake');
  const btn = document.getElementById('toggle');
  const hit = document.getElementById('hit');
  const embers = document.getElementById('embers');
  const ember = document.getElementById('wickEmber');
  const wisps = Array.from(document.querySelectorAll('.wisp'));
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  let lit = false;

  const rand = (a, b) => a + Math.random() * (b - a);

  // Headline: split into letters, give each its own color and tilt
  const head = document.getElementById('head');
  const colors = ['#fff4e6', '#ffc766', '#ff93ab', '#8ef2c8', '#fbc9a6'];
  const tilts = [0, 0, 0, 0, 0, 3, -2, 4, -3, 2, -4, 3, -2];
  let n = 0;
  head.querySelectorAll('.word').forEach((word) => {
    const text = word.textContent.trim();
    word.textContent = '';
    for (const ch of text) {
      const s = document.createElement('span');
      s.className = 'ch';
      s.setAttribute('aria-hidden', 'true');
      s.textContent = ch;
      s.style.setProperty('--i', n);
      s.style.setProperty('--c', colors[n % colors.length]);
      s.style.setProperty('--r', tilts[n % tilts.length] + 'deg');
      word.appendChild(s);
      n++;
    }
  });

  function spawnEmber() {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', (200 + rand(-5, 5)).toFixed(1));
    c.setAttribute('cy', '40');
    c.setAttribute('r', rand(1.4, 2.8).toFixed(1));
    c.setAttribute('fill', '#ffd27a');
    embers.appendChild(c);
    const dx = rand(-14, 14);
    const dy = rand(40, 80);
    const anim = c.animate(
      [
        { transform: 'translate(0px, 0px)', opacity: 1 },
        { transform: 'translate(' + dx + 'px, ' + (-dy) + 'px)', opacity: 0 }
      ],
      { duration: rand(1400, 2100), easing: 'ease-out' }
    );
    anim.onfinish = () => c.remove();
  }

  function puff() {
    wisps.forEach((w, i) => {
      w.animate(
        [
          { opacity: 0, strokeDashoffset: 100, transform: 'translateY(0px)' },
          { opacity: 0.85, strokeDashoffset: 0, transform: 'translateY(-10px)', offset: 0.35 },
          { opacity: 0, strokeDashoffset: 0, transform: 'translateY(-40px)' }
        ],
        { duration: 2200 + i * 350, delay: i * 160, easing: 'ease-out' }
      );
    });
    ember.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1800, easing: 'ease-out' });
  }

  // White hearts float up from the button on every click
  const heartsLayer = document.getElementById('hearts');
  const HEART = '<svg viewBox="0 0 32 29" aria-hidden="true"><path fill="#ffffff" d="M16 28 C16 28 2 18 2 9 C2 4.5 5.5 1 10 1 C12.5 1 14.8 2.3 16 4.5 C17.2 2.3 19.5 1 22 1 C26.5 1 30 4.5 30 9 C30 18 16 28 16 28 Z"/></svg>';

  function spawnHearts() {
    if (heartsLayer.childElementCount > 60) return;
    const r = btn.getBoundingClientRect();
    const ox = r.left + r.width / 2;
    const oy = r.top + r.height / 2;
    const calm = reduce.matches;
    for (let i = 0; i < 10; i++) {
      const size = rand(14, 30);
      const h = document.createElement('span');
      h.className = 'heart';
      h.style.width = size + 'px';
      h.style.height = (size * 0.9) + 'px';
      h.style.left = (ox - size / 2) + 'px';
      h.style.top = (oy - size / 2) + 'px';
      h.innerHTML = HEART;
      heartsLayer.appendChild(h);
      const dx = rand(-90, 90);
      const dy = calm ? 24 : rand(160, 320);
      const rot = rand(-35, 35);
      const a = h.animate(
        [
          { transform: 'translate(0px, 0px) scale(0.4) rotate(0deg)', opacity: 0 },
          {
            transform: 'translate(' + (dx / 2 + rand(-14, 14)) + 'px, ' + (-dy / 2) + 'px) scale(1) rotate(' + (rot / 2) + 'deg)',
            opacity: 1,
            offset: 0.4
          },
          { transform: 'translate(' + dx + 'px, ' + (-dy) + 'px) scale(0.9) rotate(' + rot + 'deg)', opacity: 0 }
        ],
        { duration: calm ? 900 : rand(1700, 2600), delay: i * 70, easing: 'ease-out', fill: 'both' }
      );
      a.onfinish = () => h.remove();
    }
  }

  // Starts (or restarts) the HAPPY BIRTHDAY writing
  function writeTitle() {
    head.classList.remove('idle');
    head.classList.remove('play');
    void head.offsetWidth;
    head.classList.add('play');
  }

  function setLit(on) {
    lit = on;
    svg.classList.toggle('out', !on);
    svg.setAttribute('aria-label', on
      ? 'Ek cake jisme ek jalti hui candle hai'
      : 'Ek cake jisme bujhi hui candle hai');
    if (on) writeTitle();
    else puff();
  }

  setInterval(() => {
    if (lit && !document.hidden && !reduce.matches) spawnEmber();
  }, 420);

  hit.addEventListener('click', () => setLit(!lit));
  btn.addEventListener('click', () => {
    setLit(!lit);
    spawnHearts();
  });
})();
</script>

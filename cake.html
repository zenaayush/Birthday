<title>Birthday Cake</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap">
<style>
  :root {
    --bg: #4466ff;
    --ink: #14110f;
    --cream: #fff4e6;
    --font-title: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --vh: 1vh;
    color-scheme: dark;
  }

  /* dvh keeps things inside the screen when the mobile address bar shows */
  @supports (height: 1dvh) {
    :root { --vh: 1dvh; }
  }

  html { height: 100%; }

  body {
    box-sizing: border-box;
    min-height: 100%;
    margin: 0;
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--bg);
    color: var(--cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    overflow-x: hidden;
  }

  /* ---------- title ---------- */

  .title {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 100%;
    font-family: var(--font-title);
    font-weight: 400;
    line-height: 1;
    text-align: center;
  }

  .word {
    display: flex;
    justify-content: center;
    white-space: nowrap;
  }

  .word-small {
    font-size: min(11vw, 4rem, calc(8 * var(--vh)));
    margin-bottom: -0.1em;
  }

  .word-big {
    font-size: min(15vw, 5.6rem, calc(11 * var(--vh)));
  }

  .letter {
    display: inline-block;
    color: var(--color, var(--cream));
    -webkit-text-stroke: 0.11em var(--ink);
    paint-order: stroke fill;
    text-shadow: 0.04em 0.07em 0 var(--ink);
    margin-inline: 0.012em;
    transform: rotate(var(--tilt, 0deg));
  }

  /* letters stay hidden until the first tap */
  .title.waiting .letter { opacity: 0; }

  /* ---------- cake ---------- */

  .cake-wrap {
    width: min(92vw, 520px, calc(46 * var(--vh)));
    max-width: 100%;
  }

  .cake {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .cake:focus { outline: none; }

  .cake.using-keyboard:focus {
    outline: 3px solid var(--cream);
    outline-offset: 8px;
    border-radius: 12px;
  }

  /* ---------- flame ---------- */

  .flame-part {
    transform-box: fill-box;
    transform-origin: 50% 100%;
  }

  #flame {
    transform-origin: 200px 98px;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease-out;
  }

  .glow { transform-origin: 200px 70px; }
  #glow-wrap { transition: opacity 0.5s ease-out; }

  /* candle is out: squash the flame and hide the glow */
  .cake.out #flame {
    transform: scale(0.15, 0.04);
    opacity: 0;
    transition: transform 0.22s ease-in, opacity 0.22s ease-in;
  }
  .cake.out #glow-wrap {
    opacity: 0;
    transition: opacity 0.25s ease-in;
  }

  .smoke {
    fill: none;
    stroke: rgba(255, 255, 255, 0.8);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    opacity: 0;
  }

  #wick-ember { opacity: 0; }

  @media (prefers-reduced-motion: no-preference) {
    .flame-outer { animation: flicker-a 1.3s ease-in-out infinite; }
    .flame-mid   { animation: flicker-b 0.9s ease-in-out infinite; }
    .flame-core  { animation: flicker-c 0.7s ease-in-out infinite; }
    .glow        { animation: pulse 2.1s ease-in-out infinite; }

    /* 13 letters, one every 0.74s, so the whole thing takes about 10s */
    .title.writing .letter {
      animation: drop-in 0.7s cubic-bezier(0.2, 0.8, 0.3, 1) both;
      animation-delay: calc(var(--i) * 0.74s + 0.3s);
    }
  }

  @keyframes drop-in {
    0% {
      opacity: 0;
      transform: translateY(-0.5em) scale(1.7) rotate(calc(var(--tilt) - 14deg));
    }
    55% {
      opacity: 1;
      transform: translateY(0.06em) scale(0.92) rotate(calc(var(--tilt) + 3deg));
    }
    80% {
      opacity: 1;
      transform: translateY(-0.02em) scale(1.04) rotate(var(--tilt));
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1) rotate(var(--tilt));
    }
  }

  @keyframes flicker-a {
    0%, 100% { transform: scale(1, 1) rotate(0deg); }
    20% { transform: scale(0.95, 1.07) rotate(-3deg); }
    45% { transform: scale(1.05, 0.95) rotate(2.5deg); }
    70% { transform: scale(0.97, 1.05) rotate(-1.5deg); }
  }

  @keyframes flicker-b {
    0%, 100% { transform: scale(1, 1) rotate(1deg); }
    30% { transform: scale(0.92, 1.1) rotate(-3deg); }
    60% { transform: scale(1.06, 0.94) rotate(3deg); }
  }

  @keyframes flicker-c {
    0%, 100% { transform: scale(1, 1); }
    35% { transform: scale(0.9, 1.12); }
    70% { transform: scale(1.08, 0.92); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }

  /* ---------- hearts ---------- */

  /* sits above everything but lets taps go through */
  #hearts {
    position: fixed;
    inset: 0;
    z-index: 20;
    overflow: hidden;
    pointer-events: none;
  }

  .heart {
    position: absolute;
    display: block;
  }

  .heart svg {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>

<h1 class="title waiting" id="title" aria-label="Happy Birthday">
  <span class="word word-small">HAPPY</span>
  <span class="word word-big">BIRTHDAY</span>
</h1>

<main class="cake-wrap">
  <svg class="cake out" id="cake" viewBox="0 -10 400 370" role="button" tabindex="0"
       aria-label="Birthday cake with an unlit candle. Tap to light it.">
    <defs>
      <!-- wobbly edges so the outlines look hand drawn -->
      <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="4" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <pattern id="stripes" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="rotate(40)">
        <rect width="14" height="14" fill="#ffe3d6"/>
        <rect width="7" height="14" fill="#dc2f55"/>
      </pattern>
      <radialGradient id="glow-grad">
        <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.85"/>
        <stop offset="0.45" stop-color="#ffc46b" stop-opacity="0.28"/>
        <stop offset="1" stop-color="#ffc46b" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <g id="glow-wrap">
      <circle class="glow" cx="200" cy="70" r="125" fill="url(#glow-grad)"/>
    </g>

    <g filter="url(#wobble)" stroke="#14110f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <!-- plate -->
      <ellipse cx="200" cy="322" rx="152" ry="24" fill="#c01f48"/>

      <!-- sponge -->
      <path d="M62 226 L62 306 C62 328 130 336 200 336 C270 336 338 328 338 306 L338 226 Z" fill="#fbc9a6"/>

      <!-- frosting with drips -->
      <path fill="#dc2f55" d="M60 214 C60 182 122 168 200 168 C278 168 340 182 340 214 L340 234
        C334 250 318 250 312 236 C306 224 296 228 290 244 C284 262 266 264 258 246
        C252 232 240 232 234 248 C228 266 208 268 200 250 C194 234 182 234 176 250
        C170 268 150 266 144 248 C138 232 128 230 122 246 C116 264 98 262 92 244
        C86 228 76 230 70 240 C66 246 62 244 60 234 Z"/>

      <!-- shiny bits on the frosting -->
      <g fill="none" stroke="#ff93ab" stroke-width="4">
        <path d="M96 196 Q120 182 160 178"/>
        <path d="M244 178 Q284 180 306 194"/>
      </g>

      <!-- candle and wick -->
      <path d="M188 110 Q188 104 194 104 L206 104 Q212 104 212 110 L212 174 Q200 181 188 174 Z"
            fill="url(#stripes)" stroke-width="4"/>
      <path d="M200 104 L200 92" fill="none" stroke-width="3.5"/>
    </g>

    <!-- smoke when the candle goes out -->
    <path class="smoke" pathLength="100" d="M200 90 C192 70 210 56 200 36 C192 20 206 8 200 -6"/>
    <path class="smoke" pathLength="100" d="M198 90 C206 74 190 60 198 44 C206 30 192 18 198 6"/>
    <path class="smoke" pathLength="100" d="M202 90 C196 72 212 62 204 46 C198 32 210 20 204 8"/>
    <circle id="wick-ember" cx="200" cy="91" r="3" fill="#ff8a3d"/>

    <!-- flame: three layers, each flickers on its own timing -->
    <g id="flame">
      <g transform="translate(200 94)">
        <path class="flame-part flame-outer" fill="#ff5f6d" stroke="#14110f" stroke-width="4" stroke-linejoin="round"
              d="M0 2 C-16 -2 -19 -26 -3 -58 C-2 -62 0 -66 2 -68 C4 -62 19 -30 16 -12 C14 -2 6 2 0 2 Z"/>
        <path class="flame-part flame-mid" fill="#ffc766"
              d="M0 -1 C-9 -4 -10 -17 0 -35 C10 -17 9 -4 0 -1 Z"/>
        <path class="flame-part flame-core" fill="#fff6d8"
              d="M0 -2 C-4 -4 -4 -10 0 -18 C4 -10 4 -4 0 -2 Z"/>
      </g>
    </g>

    <g id="sparks"></g>
  </svg>
</main>

<div id="hearts" aria-hidden="true"></div>

<script>
(function () {
  var SVG_NS = 'http://www.w3.org/2000/svg';

  var title = document.getElementById('title');
  var cake = document.getElementById('cake');
  var sparks = document.getElementById('sparks');
  var wickEmber = document.getElementById('wick-ember');
  var smoke = document.querySelectorAll('.smoke');
  var heartsLayer = document.getElementById('hearts');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  var lit = false;

  function rand(min, max) {
    return min + Math.random() * (max - min);
  }

  // Split the title into one span per letter, each with its own color and tilt
  var colors = ['#fff4e6', '#ffc766', '#ff93ab', '#8ef2c8', '#fbc9a6'];
  var tilts = [0, 0, 0, 0, 0, 3, -2, 4, -3, 2, -4, 3, -2];
  var count = 0;

  title.querySelectorAll('.word').forEach(function (word) {
    var text = word.textContent.trim();
    word.textContent = '';

    text.split('').forEach(function (ch) {
      var span = document.createElement('span');
      span.className = 'letter';
      span.setAttribute('aria-hidden', 'true');
      span.textContent = ch;
      span.style.setProperty('--i', count);
      span.style.setProperty('--color', colors[count % colors.length]);
      span.style.setProperty('--tilt', tilts[count % tilts.length] + 'deg');
      word.appendChild(span);
      count++;
    });
  });

  // Restart the writing animation from the first letter
  function writeTitle() {
    title.classList.remove('waiting', 'writing');
    void title.offsetWidth; // force a reflow so the animation restarts
    title.classList.add('writing');
  }

  // Little sparks
  function spawnSpark() {
    var dot = document.createElementNS(SVG_NS, 'circle');
    dot.setAttribute('cx', (200 + rand(-5, 5)).toFixed(1));
    dot.setAttribute('cy', '40');
    dot.setAttribute('r', rand(1.4, 2.8).toFixed(1));
    dot.setAttribute('fill', '#ffd27a');
    sparks.appendChild(dot);

    var driftX = rand(-14, 14);
    var riseY = rand(40, 80);

    var anim = dot.animate([
      { transform: 'translate(0px, 0px)', opacity: 1 },
      { transform: 'translate(' + driftX + 'px, ' + (-riseY) + 'px)', opacity: 0 }
    ], { duration: rand(1400, 2100), easing: 'ease-out' });

    anim.onfinish = function () { dot.remove(); };
  }

  setInterval(function () {
    if (lit && !document.hidden && !reduceMotion.matches) spawnSpark();
  }, 420);

  // Smoke curls up 
  function puff() {
    smoke.forEach(function (path, i) {
      path.animate([
        { opacity: 0, strokeDashoffset: 100, transform: 'translateY(0px)' },
        { opacity: 0.85, strokeDashoffset: 0, transform: 'translateY(-10px)', offset: 0.35 },
        { opacity: 0, strokeDashoffset: 0, transform: 'translateY(-40px)' }
      ], { duration: 2200 + i * 350, delay: i * 160, easing: 'ease-out' });
    });

    wickEmber.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1800, easing: 'ease-out' });
  }

  // White hearts 
  var HEART_SVG =
    '<svg viewBox="0 0 32 29" aria-hidden="true">' +
    '<path fill="#ffffff" d="M16 28 C16 28 2 18 2 9 C2 4.5 5.5 1 10 1 C12.5 1 14.8 2.3 16 4.5 ' +
    'C17.2 2.3 19.5 1 22 1 C26.5 1 30 4.5 30 9 C30 18 16 28 16 28 Z"/></svg>';

  function spawnHearts(x, y) {
    if (heartsLayer.childElementCount > 60) return;

    for (var i = 0; i < 10; i++) {
      var size = rand(14, 30);
      var heart = document.createElement('span');
      heart.className = 'heart';
      heart.style.width = size + 'px';
      heart.style.height = size * 0.9 + 'px';
      heart.style.left = x - size / 2 + 'px';
      heart.style.top = y - size / 2 + 'px';
      heart.innerHTML = HEART_SVG;
      heartsLayer.appendChild(heart);

      var driftX = rand(-90, 90);
      var riseY = reduceMotion.matches ? 24 : rand(160, 320);
      var spin = rand(-35, 35);

      var anim = heart.animate([
        { transform: 'translate(0px, 0px) scale(0.4) rotate(0deg)', opacity: 0 },
        {
          transform: 'translate(' + (driftX / 2 + rand(-14, 14)) + 'px, ' + (-riseY / 2) + 'px) scale(1) rotate(' + spin / 2 + 'deg)',
          opacity: 1,
          offset: 0.4
        },
        { transform: 'translate(' + driftX + 'px, ' + (-riseY) + 'px) scale(0.9) rotate(' + spin + 'deg)', opacity: 0 }
      ], {
        duration: reduceMotion.matches ? 900 : rand(1700, 2600),
        delay: i * 70,
        easing: 'ease-out',
        fill: 'both'
      });

      anim.onfinish = heart.remove.bind(heart);
    }
  }

  function toggleCandle(x, y) {
    lit = !lit;
    cake.classList.toggle('out', !lit);
    cake.setAttribute('aria-label', lit
      ? 'Birthday cake with a lit candle. Tap to blow it out.'
      : 'Birthday cake with an unlit candle. Tap to light it.');

    if (lit) {
      writeTitle();
    } else {
      puff();
    }

    spawnHearts(x, y);
  }

  cake.addEventListener('click', function (e) {
    var x = e.clientX;
    var y = e.clientY;

    // keyboard "clicks" have no pointer position, so use the middle of the cake
    if (!x && !y) {
      var box = cake.getBoundingClientRect();
      x = box.left + box.width / 2;
      y = box.top + box.height / 2;
    }

    toggleCandle(x, y);
  });

  cake.addEventListener('keydown', function (e) {
    cake.classList.add('using-keyboard');

    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      cake.click();
    }
  });

  cake.addEventListener('pointerdown', function () {
    cake.classList.remove('using-keyboard');
  });
})();
</script>
